<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgEveil" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF9C3" />
      <stop offset="50%" stop-color="#FEF3C7" />
      <stop offset="100%" stop-color="#FDE68A" />
    </linearGradient>
    <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#F59E0B" />
    </radialGradient>
  </defs>
  <rect width="600" height="400" fill="url(#bgEveil)" rx="16" />
  <!-- Nuages doux -->
  <circle cx="100" cy="90" r="45" fill="#FFFFFF" opacity="0.8" />
  <circle cx="140" cy="80" r="55" fill="#FFFFFF" opacity="0.8" />
  <circle cx="180" cy="95" r="40" fill="#FFFFFF" opacity="0.8" />
  <circle cx="480" cy="110" r="50" fill="#FFFFFF" opacity="0.7" />
  <circle cx="520" cy="100" r="60" fill="#FFFFFF" opacity="0.7" />

  <!-- Berceau / Cocon sensoriel -->
  <ellipse cx="300" cy="270" rx="140" ry="60" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="4" />
  <path d="M 180,270 Q 300,340 420,270" fill="#FDE047" opacity="0.3" />
  
  <!-- Hochet / Éveil sensoriel -->
  <circle cx="300" cy="220" r="45" fill="url(#sunGlow)" />
  <circle cx="285" cy="210" r="6" fill="#78350F" />
  <circle cx="315" cy="210" r="6" fill="#78350F" />
  <path d="M 288,230 Q 300,245 312,230" fill="none" stroke="#78350F" stroke-width="4" stroke-linecap="round" />
  <!-- Rayons de soleil souriants -->
  <line x1="300" y1="160" x2="300" y2="140" stroke="#F59E0B" stroke-width="6" stroke-linecap="round" />
  <line x1="350" y1="180" x2="365" y2="165" stroke="#F59E0B" stroke-width="6" stroke-linecap="round" />
  <line x1="365" y1="220" x2="385" y2="220" stroke="#F59E0B" stroke-width="6" stroke-linecap="round" />
  <line x1="250" y1="180" x2="235" y2="165" stroke="#F59E0B" stroke-width="6" stroke-linecap="round" />
  <line x1="235" y1="220" x2="215" y2="220" stroke="#F59E0B" stroke-width="6" stroke-linecap="round" />

  <!-- Étoiles sensorielles -->
  <circle cx="160" cy="200" r="16" fill="#F472B6" />
  <circle cx="440" cy="210" r="20" fill="#38BDF8" />
  <circle cx="220" cy="140" r="12" fill="#4ADE80" />
  <circle cx="390" cy="130" r="14" fill="#A78BFA" />
</svg>
