<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgArt" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF0F5" />
      <stop offset="50%" stop-color="#FFE4E1" />
      <stop offset="100%" stop-color="#FFF8DC" />
    </linearGradient>
    <linearGradient id="paletteGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE8CD" />
      <stop offset="100%" stop-color="#EAC89F" />
    </linearGradient>
    <linearGradient id="easelWood" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4A373" />
      <stop offset="100%" stop-color="#BC8A5F" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#E27396" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="400" fill="url(#bgArt)" rx="16" />

  <!-- Playful background blobs -->
  <circle cx="90" cy="80" r="50" fill="#FFB4D6" opacity="0.4" />
  <circle cx="520" cy="110" r="70" fill="#BAE6FD" opacity="0.5" />
  <circle cx="480" cy="320" r="60" fill="#FED7AA" opacity="0.6" />
  <circle cx="120" cy="310" r="45" fill="#BBF7D0" opacity="0.5" />

  <!-- Colorful Paint Splashes -->
  <path d="M 80,180 C 60,170 50,195 65,205 C 80,215 95,200 85,185 Z" fill="#F472B6" />
  <circle cx="70" cy="225" r="7" fill="#F472B6" />
  <circle cx="95" cy="165" r="5" fill="#F472B6" />

  <path d="M 500,230 C 520,220 535,240 515,255 C 495,270 485,245 500,230 Z" fill="#38BDF8" />
  <circle cx="535" cy="265" r="6" fill="#38BDF8" />
  <circle cx="490" cy="215" r="8" fill="#38BDF8" />

  <!-- Easel Stand -->
  <polygon points="210,340 225,340 285,130 270,130" fill="url(#easelWood)" />
  <polygon points="390,340 375,340 315,130 330,130" fill="url(#easelWood)" />
  <rect x="292" y="110" width="16" height="230" fill="#A47148" />
  <rect x="180" y="275" width="240" height="14" rx="5" fill="#8B5A2B" />

  <!-- Canvas on Easel -->
  <g filter="url(#shadow)">
    <rect x="200" y="120" width="200" height="155" rx="8" fill="#FFFFFF" stroke="#F1F5F9" stroke-width="3" />
    <!-- Rainbow Artwork on Canvas -->
    <path d="M 235,245 A 65,65 0 0,1 365,245" fill="none" stroke="#F43F5E" stroke-width="12" stroke-linecap="round" />
    <path d="M 247,245 A 53,53 0 0,1 353,245" fill="none" stroke="#FB923C" stroke-width="10" stroke-linecap="round" />
    <path d="M 258,245 A 42,42 0 0,1 342,245" fill="none" stroke="#FACC15" stroke-width="9" stroke-linecap="round" />
    <path d="M 268,245 A 32,32 0 0,1 332,245" fill="none" stroke="#4ADE80" stroke-width="8" stroke-linecap="round" />
    <path d="M 277,245 A 23,23 0 0,1 323,245" fill="none" stroke="#38BDF8" stroke-width="7" stroke-linecap="round" />

    <!-- Smiling Sun on Top Corner of Canvas -->
    <circle cx="235" cy="155" r="14" fill="#FBBF24" />
    <circle cx="231" cy="152" r="1.5" fill="#78350F" />
    <circle cx="239" cy="152" r="1.5" fill="#78350F" />
    <path d="M 231,158 Q 235,162 239,158" stroke="#78350F" stroke-width="1.2" fill="none" stroke-linecap="round" />
  </g>

  <!-- Wooden Paint Palette -->
  <g transform="translate(130, 240) rotate(-15)" filter="url(#shadow)">
    <path d="M 50,20 C 120,-10 160,50 140,100 C 120,150 40,150 10,110 C -15,75 10,35 50,20 Z" fill="url(#paletteGrad)" stroke="#C69866" stroke-width="3" />
    <circle cx="120" cy="95" r="12" fill="#FFFFFF" opacity="0.8" />
    <!-- Paint dollops on palette -->
    <circle cx="45" cy="35" r="10" fill="#EF4444" />
    <circle cx="80" cy="30" r="10" fill="#F59E0B" />
    <circle cx="115" cy="45" r="10" fill="#10B981" />
    <circle cx="130" cy="75" r="9" fill="#3B82F6" />
    <circle cx="65" cy="115" r="10" fill="#8B5CF6" />
    <circle cx="35" cy="80" r="9" fill="#EC4899" />
  </g>

  <!-- Paint Brush -->
  <g transform="translate(420, 230) rotate(35)" filter="url(#shadow)">
    <polygon points="0,0 12,0 8,110 -4,110" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1" />
    <!-- Ferrule & Bristles -->
    <rect x="-4" y="-20" width="20" height="20" fill="#94A3B8" rx="2" />
    <path d="M -4,-20 C -2,-45 14,-45 16,-20 Z" fill="#F43F5E" />
    <circle cx="6" cy="-48" r="4" fill="#F43F5E" />
  </g>

  <!-- Musical Notes Float -->
  <g transform="translate(450, 140)">
    <circle cx="10" cy="20" r="6" fill="#A855F7" />
    <rect x="14" y="2" width="3" height="18" fill="#A855F7" />
    <polygon points="17,2 28,6 28,10 17,6" fill="#A855F7" />
  </g>
  <g transform="translate(130, 110)">
    <circle cx="8" cy="16" r="5" fill="#EC4899" />
    <rect x="11" y="4" width="2.5" height="12" fill="#EC4899" />
  </g>
</svg>
