<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgNature" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E0F2FE" />
      <stop offset="60%" stop-color="#F0FDF4" />
      <stop offset="100%" stop-color="#DCFCE7" />
    </linearGradient>
    <linearGradient id="hill1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#86EFAC" />
      <stop offset="100%" stop-color="#4ADE80" />
    </linearGradient>
    <linearGradient id="hill2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ADE80" />
      <stop offset="100%" stop-color="#22C55E" />
    </linearGradient>
    <linearGradient id="sunGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
    <filter id="shadowNat" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#166534" flood-opacity="0.12" />
    </filter>
  </defs>

  <!-- Sky Background -->
  <rect width="600" height="400" fill="url(#bgNature)" rx="16" />

  <!-- Smiling Sun in Sky -->
  <g transform="translate(100, 90)">
    <!-- Sun Rays -->
    <circle cx="0" cy="0" r="46" fill="#FEF08A" opacity="0.4" />
    <circle cx="0" cy="0" r="34" fill="url(#sunGrad)" />
    <!-- Rays -->
    <line x1="0" y1="-44" x2="0" y2="-50" stroke="#F59E0B" stroke-width="4" stroke-linecap="round" />
    <line x1="0" y1="44" x2="0" y2="50" stroke="#F59E0B" stroke-width="4" stroke-linecap="round" />
    <line x1="-44" y1="0" x2="-50" y2="0" stroke="#F59E0B" stroke-width="4" stroke-linecap="round" />
    <line x1="44" y1="0" x2="50" y2="0" stroke="#F59E0B" stroke-width="4" stroke-linecap="round" />
    <line x1="-31" y1="-31" x2="-36" y2="-36" stroke="#F59E0B" stroke-width="4" stroke-linecap="round" />
    <line x1="31" y1="-31" x2="36" y2="-36" stroke="#F59E0B" stroke-width="4" stroke-linecap="round" />
    <line x1="-31" y1="31" x2="-36" y2="36" stroke="#F59E0B" stroke-width="4" stroke-linecap="round" />
    <line x1="31" y1="31" x2="36" y2="36" stroke="#F59E0B" stroke-width="4" stroke-linecap="round" />
    <!-- Happy Face -->
    <circle cx="-10" cy="-6" r="3" fill="#78350F" />
    <circle cx="10" cy="-6" r="3" fill="#78350F" />
    <circle cx="-16" cy="3" r="5" fill="#F87171" opacity="0.7" />
    <circle cx="16" cy="3" r="5" fill="#F87171" opacity="0.7" />
    <path d="M -11,4 Q 0,16 11,4" stroke="#78350F" stroke-width="2.5" fill="none" stroke-linecap="round" />
  </g>

  <!-- Fluffy Cloud -->
  <g fill="#FFFFFF" opacity="0.85" transform="translate(420, 70)">
    <circle cx="20" cy="20" r="22" />
    <circle cx="45" cy="12" r="26" />
    <circle cx="75" cy="18" r="20" />
    <rect x="20" y="20" width="55" height="20" />
  </g>

  <!-- Rolling Hills -->
  <path d="M -20,290 Q 150,210 320,270 T 620,240 L 620,420 L -20,420 Z" fill="url(#hill1)" />
  <path d="M -20,320 Q 180,270 380,310 T 620,290 L 620,420 L -20,420 Z" fill="url(#hill2)" />

  <!-- Friendly Tree -->
  <g transform="translate(450, 180)" filter="url(#shadowNat)">
    <rect x="30" y="90" width="22" height="90" rx="6" fill="#8B5A2B" />
    <!-- Foliage -->
    <circle cx="41" cy="70" r="55" fill="#15803D" />
    <circle cx="15" cy="55" r="42" fill="#16A34A" />
    <circle cx="65" cy="55" r="42" fill="#22C55E" />
    <circle cx="41" cy="35" r="40" fill="#4ADE80" />
    <!-- Little Red Apples -->
    <circle cx="20" cy="45" r="6" fill="#EF4444" />
    <circle cx="55" cy="40" r="6" fill="#EF4444" />
    <circle cx="35" cy="75" r="6" fill="#EF4444" />
    <circle cx="68" cy="70" r="5" fill="#EF4444" />
  </g>

  <!-- Flower Bed / Plants in Foreground -->
  <g transform="translate(180, 240)" filter="url(#shadowNat)">
    <!-- Plant Pot -->
    <polygon points="40,90 90,90 82,145 48,145" fill="#EA580C" />
    <rect x="36" y="80" width="58" height="12" rx="4" fill="#C2410C" />
    <!-- Sunflower -->
    <line x1="65" y1="80" x2="65" y2="25" stroke="#15803D" stroke-width="5" stroke-linecap="round" />
    <!-- Leaves -->
    <path d="M 65,60 Q 40,55 45,45 Q 60,50 65,58" fill="#22C55E" />
    <path d="M 65,45 Q 90,40 85,30 Q 70,35 65,43" fill="#22C55E" />
    <!-- Flower Petals -->
    <circle cx="65" cy="22" r="28" fill="#FACC15" />
    <circle cx="65" cy="22" r="14" fill="#78350F" />
    <circle cx="62" cy="20" r="1.5" fill="#FEF08A" />
    <circle cx="68" cy="20" r="1.5" fill="#FEF08A" />
    <path d="M 62,25 Q 65,28 68,25" stroke="#FEF08A" stroke-width="1.2" fill="none" stroke-linecap="round" />
  </g>

  <!-- Cute Watering Can -->
  <g transform="translate(90, 310)" filter="url(#shadowNat)">
    <rect x="20" y="20" width="46" height="38" rx="10" fill="#38BDF8" />
    <path d="M 60,35 L 90,20 L 92,26 L 66,45 Z" fill="#0284C7" />
    <!-- Spout Rose -->
    <ellipse cx="94" cy="21" rx="5" ry="9" fill="#0284C7" />
    <!-- Water Drops -->
    <circle cx="106" cy="25" r="3" fill="#60A5FA" />
    <circle cx="112" cy="34" r="2.5" fill="#60A5FA" />
    <circle cx="116" cy="45" r="2" fill="#60A5FA" />
    <!-- Handle -->
    <path d="M 22,25 C 0,25 0,52 22,52" fill="none" stroke="#0284C7" stroke-width="6" stroke-linecap="round" />
  </g>

  <!-- Flying Butterfly -->
  <g transform="translate(320, 160) rotate(15)">
    <!-- Wings -->
    <path d="M 0,0 C -25,-25 -30,5 0,10 C -28,15 -18,35 0,15" fill="#F472B6" />
    <path d="M 0,0 C 25,-25 30,5 0,10 C 28,15 18,35 0,15" fill="#FB7185" />
    <!-- Body -->
    <ellipse cx="0" cy="8" rx="2" ry="10" fill="#475569" />
    <line x1="0" y1="0" x2="-6" y2="-7" stroke="#475569" stroke-width="1.2" stroke-linecap="round" />
    <line x1="0" y1="0" x2="6" y2="-7" stroke="#475569" stroke-width="1.2" stroke-linecap="round" />
  </g>

  <!-- Little Daisies in Grass -->
  <g transform="translate(260, 345)">
    <circle cx="0" cy="0" r="5" fill="#FACC15" />
    <circle cx="-7" cy="0" r="3.5" fill="#FFFFFF" />
    <circle cx="7" cy="0" r="3.5" fill="#FFFFFF" />
    <circle cx="0" cy="-7" r="3.5" fill="#FFFFFF" />
    <circle cx="0" cy="7" r="3.5" fill="#FFFFFF" />
  </g>
  <g transform="translate(370, 360)">
    <circle cx="0" cy="0" r="5" fill="#FACC15" />
    <circle cx="-7" cy="0" r="3.5" fill="#FFFFFF" />
    <circle cx="7" cy="0" r="3.5" fill="#FFFFFF" />
    <circle cx="0" cy="-7" r="3.5" fill="#FFFFFF" />
    <circle cx="0" cy="7" r="3.5" fill="#FFFFFF" />
  </g>
</svg>
